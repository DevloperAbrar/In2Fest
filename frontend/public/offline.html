<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12172a" />
    <title>No internet - In2Fest</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f2f3f6; color: #12172a;
      }
      .card {
        max-width: 380px; width: 100%; background: #fff; border: 1px solid #c3c7d6; border-radius: 16px;
        padding: 32px 24px; text-align: center; box-shadow: 0 8px 30px rgba(18, 23, 42, 0.08);
      }
      .icon { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 14px; background: #12172a; display: flex; align-items: center; justify-content: center; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.5; color: #6d7591; margin: 0 0 20px; }
      button { width: 100%; border: 0; border-radius: 10px; padding: 12px 16px; font-size: 15px; font-weight: 600; color: #fff; background: #e8192c; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1l22 22M16.7 11.1A10.9 10.9 0 0 1 20 13M5 12.9a10.9 10.9 0 0 1 5.2-2.6M8.5 16.4a5 5 0 0 1 7 0M12 20h.01M2 8.8a15 15 0 0 1 4.2-2.5M10.7 5.1A15 15 0 0 1 22 8.8" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>In2Fest needs an internet connection so your billing, payments and bookings always stay accurate. Please check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
