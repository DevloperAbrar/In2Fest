<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary SEO -->
    <title>In2Fest - Find Verified Local Businesses & Vendors Near You</title>
    <meta name="description" content="In2Fest (also written In 2 Fest or In Two Fest) helps you find and contact verified coaching classes, gyms, clinics, shops, event vendors and local services near you. Free." />
    <meta name="author" content="In2Fest" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://www.in2fest.com/" />

    <!-- Favicon and PWA -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="In2Fest" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="In2Fest - Find Verified Local Businesses & Vendors Near You" />
    <meta property="og:description" content="Search, compare and directly contact verified local businesses on In2Fest: classes, clinics, gyms, shops, event vendors and services." />
    <meta property="og:image" content="https://www.in2fest.com/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="In2Fest - Find Verified Local Businesses and Vendors" />
    <meta property="og:url" content="https://www.in2fest.com/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="In2Fest - Find Verified Local Businesses & Vendors Near You" />
    <meta name="twitter:description" content="Search, compare and directly contact verified local businesses on In2Fest." />
    <meta name="twitter:image" content="https://www.in2fest.com/og-default.jpg" />
    <meta name="twitter:image:alt" content="In2Fest - Find Verified Local Businesses and Vendors" />

    <!-- Mobile / PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="In2Fest" />
    <meta name="application-name" content="In2Fest" />

    <!-- Performance hints -->
    <link rel="dns-prefetch" href="//api.in2fest.com" />
    <link rel="preconnect" href="https://pub-cb0fac558dd14a7d9077f0e0427b163f.r2.dev" crossorigin />

    <!-- Organization + WebSite schema.
         Add "sameAs" with your REAL Instagram / Facebook / LinkedIn URLs once those profiles exist.
         Do not list profiles that do not exist, it hurts more than it helps. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.in2fest.com/#organization",
          "name": "In2Fest",
          "alternateName": ["In2Fest.com", "In 2 Fest", "In Two Fest", "Intwofest", "in2fest"],
          "url": "https://www.in2fest.com/",
          "logo": {
            "@type": "ImageObject",
            "@id": "https://www.in2fest.com/#logo",
            "url": "https://www.in2fest.com/logo.png",
            "caption": "In2Fest"
          },
          "image": { "@id": "https://www.in2fest.com/#logo" },
          "description": "In2Fest is a platform to find and contact verified local businesses and vendors across India, from coaching classes and clinics to shops and event vendors.",
          "areaServed": { "@type": "Country", "name": "India" },
          "contactPoint": [
            {
              "@type": "ContactPoint",
              "contactType": "customer support",
              "availableLanguage": ["Hindi", "English"],
              "url": "https://www.in2fest.com/contact"
            }
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://www.in2fest.com/#website",
          "name": "In2Fest",
          "alternateName": ["In 2 Fest", "In Two Fest", "Intwofest"],
          "url": "https://www.in2fest.com/",
          "publisher": { "@id": "https://www.in2fest.com/#organization" },
          "inLanguage": "en-IN",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://www.in2fest.com/search?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- Boot splash -->
    <style>
      #boot-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #f9fafb;
      }
      #boot-splash img { height: 40px; width: auto; animation: boot-pulse 1.4s ease-in-out infinite; }
      #boot-splash .boot-spinner {
        width: 36px; height: 36px; border-radius: 50%;
        border: 3px solid #e3e5ec; border-top-color: #e8192c;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-pulse { 50% { opacity: 0.4; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" role="status" aria-label="Loading In2Fest">
        <img src="/logo.png" alt="In2Fest" />
        <div class="boot-spinner"></div>
      </div>
    </div>

    <!-- Crawlable content for bots and browsers that do not run JavaScript -->
    <noscript>
      <main style="max-width:720px;margin:0 auto;padding:32px 16px;font-family:Inter,Arial,sans-serif;color:#1a2035">
        <h1>In2Fest: Find Verified Local Businesses and Vendors Near You</h1>
        <p>
          In2Fest (also written In 2 Fest or In Two Fest) is a platform to search, compare and directly
          contact verified coaching classes, schools, gyms, clinics, salons, shops, restaurants, repair
          services, wedding and event vendors and other local businesses across India. There is no middleman
          and no commission. Business owners can list for free and get their own website and booking calendar.
        </p>
        <nav aria-label="Main">
          <ul>
            <li><a href="/search">Search all vendors</a></li>
            <li><a href="/categories">Browse all categories</a></li>
            <li><a href="/cities">Browse by city</a></li>
            <li><a href="/for-vendors">List your business free</a></li>
            <li><a href="/get-website">Get your own website</a></li>
            <li><a href="/about">About In2Fest</a></li>
            <li><a href="/contact">Contact us</a></li>
          </ul>
        </nav>
        <p>Please enable JavaScript to search and contact vendors.</p>
      </main>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
